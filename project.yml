# XcodeGen spec for the app target. All logic lives in the SMPKit Swift package;
# the generated SMP.xcodeproj is not committed. Run `xcodegen generate` to create it.
name: SMP
options:
  bundleIdPrefix: com.kirikakaese
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, de, Base]

# Signing team comes from the git-ignored Config/Local.xcconfig (see Config/Signing.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      # Universal binary: Apple Silicon + Intel.
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO

packages:
  SMPKit:
    path: Packages/SMPKit

targets:
  SMP:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # English and German strings for the app and the SMPKit views it shows.
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: SMPKit
        product: SMPCore
      - package: SMPKit
        product: SMPServices
      - package: SMPKit
        product: SMPUI
      # The agent helper is embedded as a login item and registered with SMAppService.
      - target: SMPAgentHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_NAME: SMP
        PRODUCT_BUNDLE_IDENTIFIER: com.kirikakaese.smp
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/SMP.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES

  SMPAgentHelper:
    type: application
    platform: macOS
    sources:
      - path: App/AgentHelper/Sources
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: SMPKit
        product: SMPCore
      - package: SMPKit
        product: SMPServices
      - package: SMPKit
        product: SMPAgent
    settings:
      base:
        PRODUCT_NAME: SMPAgentHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.kirikakaese.smp.agent
        INFOPLIST_FILE: App/AgentHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/AgentHelper/SMPAgent.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

schemes:
  SMP:
    build:
      targets:
        SMP: all
    run:
      config: Debug
    archive:
      config: Release
