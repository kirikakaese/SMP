# XcodeGen spec for the app target. All logic lives in the SMPKit Swift package;
# the generated SMP.xcodeproj is not committed. Run `xcodegen generate` to create it.
name: SMP
options:
  bundleIdPrefix: com.kirikakaese
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      # Universal binary: Apple Silicon + Intel.
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO

packages:
  SMPKit:
    path: Packages/SMPKit

targets:
  SMP:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies:
      - package: SMPKit
        product: SMPCore
      - package: SMPKit
        product: SMPServices
      - package: SMPKit
        product: SMPUI
    settings:
      base:
        PRODUCT_NAME: SMP
        PRODUCT_BUNDLE_IDENTIFIER: com.kirikakaese.smp
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/SMP.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES

schemes:
  SMP:
    build:
      targets:
        SMP: all
    run:
      config: Debug
    archive:
      config: Release
