name: Strings

concurrency:
  group: strings-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    name: Extract localizable strings
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build with string extraction
        run: |
          xcodebuild build \
            -project SMP.xcodeproj \
            -scheme SMP \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_EMIT_LOC_STRINGS=YES \
            ONLY_ACTIVE_ARCH=YES \
            -quiet
      - name: Check the String Catalog
        # Fails when a string in the code is missing from the catalog or has no German translation.
        run: python3 scripts/extract_strings.py build App/Resources/Localizable.xcstrings
