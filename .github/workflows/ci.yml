name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: swift-format
        run: xcrun swift-format lint --recursive --parallel App Packages/SMPKit/Sources Packages/SMPKit/Tests

  test:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && /usr/bin/ssh -V
      - name: Install PuTTY (for PuTTYgen compatibility tests)
        run: brew install putty
      - name: Build
        run: swift build --package-path Packages/SMPKit
      - name: Test
        run: swift test --package-path Packages/SMPKit

  app:
    name: App build (universal, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project SMP.xcodeproj \
            -scheme SMP \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify universal binaries and the embedded agent helper
        run: |
          app=build/Build/Products/Release/SMP.app
          for binary in "$app/Contents/MacOS/SMP" "$app/Contents/Library/LoginItems/SMPAgent.app/Contents/MacOS/SMPAgent"; do
            lipo -archs "$binary" | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          done
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Library/LoginItems/SMPAgent.app/Contents/Info.plist" | grep -q true
