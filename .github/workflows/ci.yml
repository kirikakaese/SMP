name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: swift-format
        run: xcrun swift-format lint --recursive --parallel App Packages/SMPKit/Sources Packages/SMPKit/Tests

  test:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version && /usr/bin/ssh -V
      - name: Install PuTTY (for PuTTYgen compatibility tests)
        run: brew install putty
      - name: Build
        run: swift build --package-path Packages/SMPKit
      - name: Test
        run: swift test --package-path Packages/SMPKit

  app:
    name: App build (universal, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project SMP.xcodeproj \
            -scheme SMP \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify universal binaries and the embedded agent helper
        run: |
          app=build/Build/Products/Release/SMP.app
          for binary in "$app/Contents/MacOS/SMP" "$app/Contents/Library/LoginItems/SMPAgentHelper.app/Contents/MacOS/SMPAgentHelper"; do
            lipo -archs "$binary" | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          done
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Library/LoginItems/SMPAgentHelper.app/Contents/Info.plist" | grep -q true

  launch:
    name: App launch (ad-hoc signed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Signed the same way as a release, so a bundle macOS won't start fails here, before a tag.
      - name: Build (ad-hoc signed, as in a release)
        run: |
          xcodebuild build \
            -project SMP.xcodeproj \
            -scheme SMP \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO
      - name: Diagnostic (temporary) - the 0.9.0 crash with the Hardened Runtime on
        continue-on-error: true
        run: |
          rm -rf /tmp/runtime && mkdir /tmp/runtime && ditto build/Build/Products/Release/SMP.app /tmp/runtime/SMP.app
          codesign --force --sign - --options runtime --entitlements App/SMP.entitlements /tmp/runtime/SMP.app
          if scripts/launch_test.sh /tmp/runtime/SMP.app 10; then
            echo "UNEXPECTED: launched with the Hardened Runtime"
          else
            echo "REPRODUCED: refused to launch with the Hardened Runtime, as 0.9.0 did"
          fi
      - name: Re-sign the app ad-hoc
        run: scripts/adhoc_sign.sh build/Build/Products/Release/SMP.app
      - name: Launch the app
        run: scripts/launch_test.sh build/Build/Products/Release/SMP.app
