<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How an SMP release works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="960" height="446" rx="12" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">How an SMP release works</text>

  <!-- Column 1 -->
  <rect x="24" y="64" width="280" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="52" cy="92" r="14" fill="#0969da"/><text x="52" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">A</text>
  <text x="76" y="97" font-size="16" font-weight="600" fill="#1f2328">On your Mac (once)</text>
  <rect x="44" y="120" width="240" height="44" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="164" y="147" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">generate_keys</text>
  <text x="44" y="194" font-size="13" fill="#1f2328">creates a key pair:</text>
  <text x="44" y="218" font-size="13" fill="#1f2328">• <tspan font-weight="600">public key</tspan>: goes into the app</text>
  <text x="44" y="242" font-size="13" fill="#1f2328">• <tspan font-weight="600">private key</tspan>: signs updates,</text>
  <text x="56" y="262" font-size="13" fill="#1f2328">stays secret, a copy stays in</text>
  <text x="56" y="282" font-size="13" fill="#1f2328">your login keychain</text>

  <!-- Column 2 -->
  <rect x="340" y="64" width="280" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="368" cy="92" r="14" fill="#0969da"/><text x="368" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">B</text>
  <text x="392" y="97" font-size="16" font-weight="600" fill="#1f2328">GitHub settings (once)</text>
  <text x="360" y="128" font-size="12" fill="#57606a">SMP repo → Settings → Secrets and variables</text>
  <rect x="360" y="140" width="240" height="40" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="372" y="157" font-size="11" fill="#57606a">Variable</text>
  <text x="372" y="173" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">SPARKLE_PUBLIC_KEY</text>
  <rect x="360" y="188" width="240" height="40" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="372" y="205" font-size="11" fill="#57606a">Secret</text>
  <text x="372" y="221" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">SPARKLE_PRIVATE_KEY</text>
  <rect x="360" y="236" width="240" height="40" rx="6" fill="#fff" stroke="#d0d7de" stroke-dasharray="4 3"/>
  <text x="372" y="253" font-size="11" fill="#57606a">Secret (optional, for Homebrew)</text>
  <text x="372" y="269" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">TAP_TOKEN</text>
  <text x="360" y="300" font-size="12" fill="#57606a">+ a repo named homebrew-tap</text>

  <!-- Column 3 -->
  <rect x="656" y="64" width="280" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="684" cy="92" r="14" fill="#1f883d"/><text x="684" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">C</text>
  <text x="708" y="97" font-size="16" font-weight="600" fill="#1f2328">Every release</text>
  <rect x="676" y="120" width="240" height="36" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="796" y="143" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">git push origin v0.9.0</text>
  <line x1="796" y1="158" x2="796" y2="176" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="180" width="240" height="36" rx="6" fill="#dafbe1" stroke="#1f883d"/>
  <text x="796" y="203" text-anchor="middle" font-size="13" fill="#1f2328">“Release” workflow runs (~15 min)</text>
  <line x1="796" y1="218" x2="796" y2="236" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="676" y="256" font-size="13" fill="#1f2328">• GitHub release: DMG, zip,</text>
  <text x="688" y="275" font-size="13" fill="#1f2328">appcast.xml, SHA256SUMS.txt</text>
  <text x="676" y="298" font-size="13" fill="#1f2328">• homebrew-tap: Casks/smp.rb</text>

  <!-- Arrows between columns -->
  <line x1="306" y1="190" x2="336" y2="190" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="622" y1="190" x2="652" y2="190" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Users -->
  <rect x="24" y="338" width="912" height="90" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="44" y="366" font-size="14" font-weight="600" fill="#1f2328">People using SMP</text>
  <text x="44" y="392" font-size="13" fill="#1f2328">download the DMG or run <tspan font-family="ui-monospace, Menlo, monospace">brew install --cask kirikakaese/tap/smp</tspan>. Later, SMP's updater reads appcast.xml</text>
  <text x="44" y="414" font-size="13" fill="#1f2328">and installs an update only if it was signed with your private key.</text>
</svg>
