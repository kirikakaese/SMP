<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The fine-grained token form, filled in for the Homebrew tap (sketch)</title>
  <rect width="960" height="560" rx="12" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="528" rx="10" fill="#fff" stroke="#d0d7de"/>
  <rect x="16" y="16" width="928" height="34" rx="10" fill="#f6f8fa"/>
  <rect x="16" y="40" width="928" height="10" fill="#f6f8fa"/>
  <circle cx="38" cy="33" r="6" fill="#ff5f57"/><circle cx="58" cy="33" r="6" fill="#febc2e"/><circle cx="78" cy="33" r="6" fill="#28c840"/>
  <rect x="110" y="23" width="560" height="20" rx="5" fill="#fff" stroke="#d0d7de"/>
  <text x="122" y="38" font-size="12" fill="#57606a">github.com/settings/personal-access-tokens/new</text>

  <text x="48" y="88" font-size="20" font-weight="600" fill="#1f2328">New fine-grained personal access token</text>

  <!-- name -->
  <circle cx="34" cy="122" r="11" fill="#0969da"/><text x="34" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="56" y="118" font-size="13" font-weight="600" fill="#1f2328">Token name</text>
  <rect x="56" y="126" width="300" height="28" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="66" y="145" font-size="13" fill="#1f2328">SMP release: homebrew tap</text>

  <!-- owner -->
  <text x="400" y="118" font-size="13" font-weight="600" fill="#1f2328">Resource owner</text>
  <rect x="400" y="126" width="200" height="28" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="145" font-size="13" fill="#1f2328">kirikakaese ▾</text>

  <!-- expiration -->
  <circle cx="34" cy="186" r="11" fill="#0969da"/><text x="34" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="56" y="182" font-size="13" font-weight="600" fill="#1f2328">Expiration</text>
  <rect x="56" y="190" width="200" height="28" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="66" y="209" font-size="13" fill="#1f2328">366 days ▾</text>
  <text x="270" y="209" font-size="12" fill="#57606a">GitHub emails you before it expires; see “When the token expires” in RELEASING.md.</text>

  <!-- repository access -->
  <circle cx="34" cy="252" r="11" fill="#0969da"/><text x="34" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="56" y="248" font-size="13" font-weight="600" fill="#1f2328">Repository access</text>
  <circle cx="66" cy="272" r="6" fill="#fff" stroke="#8c959f"/><text x="80" y="277" font-size="13" fill="#57606a">Public repositories</text>
  <circle cx="66" cy="296" r="6" fill="#fff" stroke="#8c959f"/><text x="80" y="301" font-size="13" fill="#57606a">All repositories</text>
  <rect x="54" y="308" width="420" height="58" rx="6" fill="none" stroke="#cf222e" stroke-width="2"/>
  <circle cx="66" cy="320" r="6" fill="#fff" stroke="#0969da" stroke-width="2"/><circle cx="66" cy="320" r="3" fill="#0969da"/>
  <text x="80" y="325" font-size="13" font-weight="600" fill="#1f2328">Only select repositories</text>
  <rect x="80" y="334" width="190" height="24" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="92" y="351" font-size="12" fill="#0969da">kirikakaese/homebrew-tap ✕</text>
  <text x="490" y="333" font-size="12" fill="#57606a">Only the tap. Never pick SMP or “All repositories”.</text>

  <!-- permissions -->
  <circle cx="34" cy="400" r="11" fill="#0969da"/><text x="34" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="56" y="396" font-size="13" font-weight="600" fill="#1f2328">Permissions</text>
  <text x="160" y="396" font-size="12" fill="#57606a">(Repository permissions, or the “+ Add permissions” button)</text>
  <rect x="54" y="406" width="560" height="36" rx="6" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/>
  <text x="68" y="429" font-size="13" font-weight="600" fill="#1f2328">Contents</text>
  <text x="140" y="429" font-size="12" fill="#57606a">Repository contents, commits…</text>
  <rect x="440" y="412" width="164" height="24" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="452" y="429" font-size="13" fill="#1f2328">Read and write ▾</text>
  <text x="56" y="464" font-size="12" fill="#57606a">“Metadata: Read-only” is added automatically. Leave everything else at “No access”.</text>

  <!-- generate -->
  <circle cx="34" cy="502" r="11" fill="#0969da"/><text x="34" y="507" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
  <rect x="56" y="486" width="150" height="32" rx="6" fill="#1f883d"/>
  <text x="131" y="507" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Generate token</text>
  <text x="220" y="507" font-size="12" fill="#57606a">Copy the token (starts with github_pat_) right away: GitHub shows it only once.</text>
  <text x="920" y="532" text-anchor="end" font-size="11" font-style="italic" fill="#8c959f">Sketch. GitHub's real form looks similar, but labels may move.</text>
</svg>
