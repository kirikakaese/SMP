  <text x="296" y="372" font-size="13" fill="#57606a">On the Variables tab the button says “New repository variable” instead.</text>
  <text x="296" y="396" font-size="13" fill="#57606a">Secrets can never be read again after saving; variables stay visible.</text>
  <text x="920" y="436" text-anchor="end" font-size="11" font-style="italic" fill="#8c959f">Sketch. GitHub's real page looks similar, but labels may move.</text>
